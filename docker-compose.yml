services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    volumes:
      - ./backend/ml/models:/app/ml/models:ro
      - ./backend/data/recorded:/app/data/recorded
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
