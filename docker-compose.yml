services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vidyut
      POSTGRES_PASSWORD: vidyut
      POSTGRES_DB: vidyut
    ports:
      - "5433:5432"
    volumes:
      - vidyut_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidyut -d vidyut"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    # Root .env is canonical. frontend/.env remains a local compatibility
    # source for existing setups and is overridden when the root defines a key.
    env_file:
      - path: ./frontend/.env
        required: false
      - path: ./.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://vidyut:vidyut@postgres:5432/vidyut
      # Containers cannot use localhost to reach n8n or the published API.
      N8N_WEBHOOK_URL: ${N8N_DOCKER_WEBHOOK_URL:-http://host.docker.internal:5678/webhook/vidyut-operator-digest}
      VIDYUT_N8N_API_URL: ${VIDYUT_N8N_API_URL:-http://host.docker.internal:8000}
      VIDYUT_PUBLIC_API_URL: ${VIDYUT_PUBLIC_API_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/ml/models:/app/ml/models:ro
      - ./backend/data/recorded:/app/data/recorded
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vidyut_pgdata:
