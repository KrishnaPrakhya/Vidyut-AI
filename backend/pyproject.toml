[project]
name = "vidyut-backend"
version = "0.1.0"
description = "Vidyut distribution network load balancing simulation backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pandapower>=2.14",
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "scipy>=1.13",
    "websockets>=13.0",
    "reportlab>=4.2",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: full-length property sweeps"]

[tool.uv]
package = false
